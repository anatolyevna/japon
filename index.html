<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de voyage du Japon d’Alina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japon d’Alina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCF4EB">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{--bg:#FCF4EB;--card:#FFFBF5;--ink:#4B3D3A;--muted:#7C6A63;--line:#F0E1D4;--accent:#CF6B64;--mix:17%;--mix2:31%;
--t1:#E8A094;--t2:#B4CA9C;--t3:#C4A8C9;--t4:#A4BED3;--t5:#EDA5B0;--t6:#EEB87D;--t7:#8EC6BD;--t8:#CEC3BB;
--hf:"Nunito","Zen Kaku Gothic New",system-ui,sans-serif;--bf:"Zen Kaku Gothic New","Nunito",system-ui,-apple-system,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--hf);font-weight:800;margin:0}
h2{font-size:1.6rem;line-height:1.2}h3{font-size:1.05rem}
p{margin:0}button{font:inherit;color:var(--ink)}
.app{max-width:760px;margin:0 auto;padding:0 20px 140px}
.top{display:flex;gap:14px;align-items:center;padding:30px 0 22px}
.mark{width:16px;height:16px;border-radius:50%;background:var(--accent);flex:none}
.top h1{font-size:1.3rem}.top p{color:var(--muted);font-size:.82rem;margin-top:2px}
.lead{color:var(--muted);margin-top:8px;max-width:50ch}
.note{margin-top:14px;font-size:.84rem;color:var(--muted)}
section{display:none;padding-top:8px}section.on{display:block}
.list{margin-top:8px}.list>*{margin-top:10px}
.blk{margin-top:28px}
/* cartes teintées à plat, contour fin */
.row,.wk,.mode,.entry,.leg{background:color-mix(in srgb,var(--d,var(--t8)) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d,var(--t8)) 38%,var(--card))}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:12px 16px;border-radius:20px;text-align:left}
.row .t{flex:1;min-width:0}.row b{font-weight:500;display:block}.row small{display:block;color:var(--muted);font-size:.8rem}
.row .go{color:var(--muted);font-size:1.3rem;line-height:1}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.ei{display:inline-flex;flex:none;color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.grp{display:flex;align-items:center;gap:10px;margin-top:28px}.grp i{width:5px;height:20px;background:var(--d);border-radius:3px}
.back{border:0;background:none;color:var(--muted);min-height:44px;padding:0;margin-bottom:4px}
.seg{display:flex;gap:3px;margin-top:16px;padding:4px;border-radius:16px;background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.seg button{flex:1 1 auto;min-height:42px;border:0;background:none;color:var(--muted);border-radius:12px;padding:0 8px;font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 5px rgba(75,50,45,.12)}
.btn{min-height:48px;padding:0 24px;border:0;border-radius:16px;background:var(--ink);color:var(--card);font-weight:700}
.btn.ghost{background:color-mix(in srgb,var(--ink) 7%,var(--bg));color:var(--ink)}
.empty{margin-top:14px;padding:28px 20px;text-align:center;color:var(--muted);border:1.5px dashed color-mix(in srgb,var(--ink) 20%,var(--bg));border-radius:22px;white-space:pre-line}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.pnav button{width:44px;height:44px;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 6%,var(--bg));font-size:1.2rem}
.wk{display:flex;gap:14px;width:100%;padding:12px 14px;border-radius:22px;text-align:left;align-items:center;min-height:80px;min-width:0;overflow:hidden}
.wk.today{box-shadow:0 0 0 2px var(--accent)}
.dt{width:58px;flex:none;text-align:center;border-radius:16px;padding:6px 0;background:color-mix(in srgb,var(--d) var(--mix2),var(--card))}
.dt small{display:block;font-size:.72rem;color:color-mix(in srgb,var(--d) 45%,var(--ink));line-height:1.25}
.dt strong{display:block;font-family:var(--hf);font-size:1.5rem;line-height:1.2}
.pv{flex:1;min-width:0;font-size:.88rem}
.pv div{display:flex;gap:8px;align-items:center;margin:2px 0;white-space:nowrap;overflow:hidden}
.pv span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pv em{color:var(--muted);font-style:normal}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}
.mh span{font-size:.75rem;color:var(--muted)}
.mc{border:1px solid var(--line);border-radius:12px;aspect-ratio:1;background:var(--card);font-size:.92rem;padding:4px 0 0;display:flex;flex-direction:column;align-items:center}
.mc.out{opacity:.4}.mc.today{border-color:var(--accent);font-weight:700}
.dots{display:flex;gap:3px;margin-top:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--d)}
.hours{margin-top:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.hr{display:flex;gap:14px;width:100%;min-height:54px;padding:10px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.hr:first-child{border-top:0}
.hr .tm{width:46px;flex:none;border:0;background:none;color:var(--muted);font-size:.85rem;padding:3px 0 0;text-align:left;min-height:32px}
.ev{display:inline-flex;gap:8px;align-items:center;padding:5px 12px 5px 8px;border-radius:12px;margin:0 6px 4px 0;font:inherit;font-size:.9rem;cursor:pointer;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));border:1px solid color-mix(in srgb,var(--d) 45%,var(--card));color:var(--ink)}
.mode{padding:12px 16px 10px;border-radius:22px;margin-top:10px}
button.mode{display:block;width:100%;text-align:left;font:inherit}
.mode .h{display:flex;gap:12px;align-items:center}.mode b{font-weight:600}
.mode svg.r{display:block;width:100%;max-width:280px;height:36px;margin-top:6px}
.mode .meta{color:var(--muted);font-size:.84rem;margin-top:2px}
.leg{margin-top:18px;border-radius:22px;padding:4px 18px 12px}
.st{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;min-height:44px;padding:0 0 0 6px;position:relative}
.st:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:3px;background:var(--d)}
.st:first-child:before{top:50%}.st:last-child:before{bottom:50%}
.st i{width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--d);z-index:1;flex:none}
.entry{position:relative;margin-top:14px;padding:18px 58px 18px 18px;border-radius:24px}
.sr{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px}
.entry .sr:first-of-type{margin-top:0}
.bd{font-size:.74rem;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));color:color-mix(in srgb,var(--d) 40%,var(--ink))}
.sr span:last-child{font-size:1.5rem;line-height:1.4}
.ro{color:var(--muted)}
.tag{display:inline-block;margin-top:10px;padding:2px 11px;border-radius:999px;font-size:.78rem;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));color:color-mix(in srgb,var(--d) 40%,var(--ink))}
.fav{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;color:var(--accent)}
.mini{border:1px solid var(--line);margin-top:12px;background:var(--card);border-radius:12px;min-height:40px;padding:0 14px;font-size:.85rem}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid color-mix(in srgb,var(--ink) 16%,var(--bg));border-radius:14px;min-height:48px;padding:0 14px;width:100%}
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:2rem;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);display:none}.fab.on{display:block}
dialog{border:0;border-radius:26px;padding:22px;width:min(440px,92vw);max-height:90vh;color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(75,61,58,.4)}
dialog label,dialog .lb{display:block;margin-top:14px;font-size:.84rem;color:var(--muted)}
dialog label input,dialog label select{margin-top:4px}
dialog .actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ch{border:1px solid color-mix(in srgb,var(--ink) 16%,var(--bg));background:var(--card);border-radius:12px;min-height:40px;padding:0 12px;font-size:.86rem;display:flex;gap:6px;align-items:center}
.ch.on{border-color:color-mix(in srgb,var(--d) 70%,var(--card));background:color-mix(in srgb,var(--d) var(--mix2),var(--card));font-weight:700}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:.88rem;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:34px;border-radius:999px;font-size:.8rem;white-space:nowrap;border:0;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));color:color-mix(in srgb,var(--d) 40%,var(--ink))}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--d)}
button.chip{min-height:44px;padding:0 16px;font-size:.88rem}
/* cadre de la carte */
.map{position:relative;height:340px;margin-top:16px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background-color:color-mix(in srgb,var(--t4) 26%,var(--card));background-image:linear-gradient(color-mix(in srgb,var(--card) 75%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--card) 75%,transparent) 1px,transparent 1px);background-size:44px 44px}
.msearch{position:absolute;left:12px;right:12px;top:12px;background:var(--card);border-radius:16px;min-height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:.88rem;box-shadow:0 3px 12px rgba(75,50,45,.1)}
.mchips{position:absolute;left:12px;right:12px;top:68px;display:flex;gap:6px;overflow:hidden}
.mph{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;color:color-mix(in srgb,var(--ink) 60%,var(--card));font-size:.84rem;padding:0 50px}
.zoom{position:absolute;right:12px;bottom:92px;display:grid;gap:6px}
.zoom span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 3px 10px rgba(75,50,45,.12);color:var(--muted)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px 16px;box-shadow:0 -4px 16px rgba(75,50,45,.08)}
.sheet i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet small{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);font-size:.74rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px}
nav button[aria-current=page]{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (min-width:900px){
 nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(26px + env(safe-area-inset-top,0px)) 12px 12px;border-top:0;border-right:1px solid var(--line)}
 nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:1rem}
 .app{margin-left:210px;max-width:none;padding:0 48px 60px}.app>*{max-width:700px}
 .fab{bottom:28px;right:40px}
}

/* ===== v6 : titres Zen Kaku nets, teintes plus claires, contours plus visibles ===== */
:root{--mix:12%;--mix2:24%;--ol:54%;--hf:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
h1,h2,h3{font-weight:700;letter-spacing:-.015em}
h2{font-size:1.55rem}
.row,.wk,.mode,.entry,.leg{border:1px solid color-mix(in srgb,var(--d,var(--t8)) var(--ol),var(--card))}
.ic{border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.dt,.bd,.tag,.chip,.ev,.rg{border:1px solid color-mix(in srgb,var(--d,var(--t8)) var(--ol),var(--card))}
.chip{border-width:1px}
.chip.on{background:color-mix(in srgb,var(--d) 42%,var(--card));font-weight:700}
.seg.wrap{flex-wrap:wrap}
.seg button{padding:0 6px;font-size:.86rem}
.seg.wrap button{flex:1 1 auto}
.mc{border-color:color-mix(in srgb,var(--ink) 14%,var(--bg))}
/* semainier vertical */
.wkv{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:16px}
.wc{display:flex;flex-direction:column;gap:5px;min-width:0;padding:0;border:0;background:none;text-align:center;font:inherit}
.wd{border-radius:14px;padding:7px 0 6px;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.wd small{display:block;font-size:.64rem;line-height:1.25;color:color-mix(in srgb,var(--d) 45%,var(--ink))}
.wd strong{display:block;font-size:1.2rem;line-height:1.25;font-weight:700}
.wc.today .wd{box-shadow:0 0 0 2px var(--accent)}
.wb{flex:1;min-height:320px;border-radius:14px;padding:8px 1px;display:flex;flex-direction:column;align-items:center;gap:9px;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card));overflow:hidden}
.wi{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:100%;min-width:0}
.wi small{font-size:.58rem;line-height:1.2;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf{color:color-mix(in srgb,var(--ink) 40%,var(--card));margin-top:6px}
.wm{font-size:.62rem;color:var(--muted)}
.lg{margin-top:20px;border-radius:22px;padding:12px 16px 14px;background:var(--card);border:1px solid var(--line)}
.lg summary{min-height:36px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.lgh{margin-top:10px;font-size:.78rem;color:var(--muted)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips2 .chip{min-height:30px;font-size:.74rem;padding:0 10px}
/* bulles de thèmes */
.bubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.bub{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:132px;padding:16px;text-align:left;font:inherit;border-radius:30px 30px 30px 10px;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.bub:nth-child(even){border-radius:30px 30px 10px 30px}
.bub b{font-weight:700;font-size:1rem;line-height:1.25;letter-spacing:-.01em}
.bub small{color:var(--muted);font-size:.78rem}
.bub .ic{width:48px;height:48px;border-radius:50%}
/* niveaux de langue */
.regp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.rp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:20px;text-align:center;font:inherit;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card));min-height:98px}
.rp .ei{color:color-mix(in srgb,var(--d) 50%,var(--ink))}
.rp b{font-weight:700}
.rp small{font-size:.66rem;line-height:1.25;color:var(--muted)}
.rp.on{background:color-mix(in srgb,var(--d) 38%,var(--card));box-shadow:0 0 0 2px color-mix(in srgb,var(--d) 75%,var(--ink))}
.rg{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 8px;border-radius:999px;font-size:.78rem;margin-bottom:4px;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));color:color-mix(in srgb,var(--d) 40%,var(--ink))}
.gauge{display:inline-flex;gap:2px;margin-left:2px}
.gauge i{width:10px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--d) 25%,var(--card))}
.gauge i.on{background:color-mix(in srgb,var(--d) 85%,var(--ink))}
.cmp{margin-top:12px;font-size:.88rem}
.cmp summary{min-height:36px;display:flex;align-items:center;cursor:pointer;color:var(--muted)}
.cv{margin-top:8px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.cv b{display:block;font-size:.74rem;font-weight:700;color:color-mix(in srgb,var(--d) 40%,var(--ink))}
.cv span{display:block;font-size:1.15rem}
.cv small{display:block}
/* étude */
.prog{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.kt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;aspect-ratio:1;border-radius:16px;font:inherit;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.kt span{font-size:1.7rem;line-height:1.15}
.kt small{font-size:.68rem;color:var(--muted)}
.kt.ok{background:color-mix(in srgb,var(--d) 45%,var(--card));border-color:color-mix(in srgb,var(--d) 80%,var(--ink))}
.kjg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.kj{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:88px;padding:6px 2px;border-radius:18px;font:inherit;background:color-mix(in srgb,var(--d) var(--mix),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card))}
.kj span{font-size:1.9rem;line-height:1.2}
.kj small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;font-size:.66rem;color:var(--muted)}
.kj.ok{background:color-mix(in srgb,var(--d) 45%,var(--card));border-color:color-mix(in srgb,var(--d) 80%,var(--ink))}
.kbig{display:grid;place-items:center;height:150px;border-radius:28px;font-size:5.5rem;line-height:1;background:color-mix(in srgb,var(--d) var(--mix2),var(--card));border:1px solid color-mix(in srgb,var(--d) var(--ol),var(--card));margin-bottom:12px}
/* plan du métro */
.mmap{margin-top:16px;border-radius:26px;overflow:hidden;background:color-mix(in srgb,var(--t4) 14%,var(--card));border:1px solid color-mix(in srgb,var(--t4) var(--ol),var(--card))}
.mm{display:block;width:100%;height:auto}
.mm .hl{font-size:9.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#FFFBF5;stroke-width:3px;stroke-linejoin:round;font-family:var(--bf)}

/* semaine : rectangles ivoire */
.wb{background:var(--card);border:1px solid color-mix(in srgb,var(--ink) 11%,var(--bg))}

/* distinction transport / lieu : quatre variantes */
html[data-dist] .ic.tr,html[data-dist] .ei.tr,html[data-dist] .ev.tr,html[data-dist] .chip.tr,html[data-dist] .lgi i.tr,html[data-dist] .dots i.tr,html[data-dist] .hr.act.tr,html[data-dist] .cont.tr{background-image:none}
/* A : hachures très pâles, seulement sur les grandes surfaces */
html[data-dist=a] .hr.act.tr{background-color:color-mix(in srgb,var(--d) 14%,var(--card));background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--d) 36%,var(--card)) 0 1px,transparent 1px 7px)}
html[data-dist=a] .dots i.tr,html[data-dist=a] .lgi i.tr{background-color:color-mix(in srgb,var(--d) 20%,var(--card));background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--d) 55%,var(--card)) 0 1px,transparent 1px 4px);border-radius:3px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--d) 55%,var(--card))}
html[data-dist=a] .ev.tr{background-color:color-mix(in srgb,var(--d) 16%,var(--card));border-radius:9px}
/* B : contour creux (plein = lieu, anneau = transport) */
html[data-dist=b] .ev.tr{background:var(--card);border:2px solid var(--d);border-radius:12px}
html[data-dist=b] .hr.act.tr{background:var(--card);box-shadow:inset 5px 0 0 var(--d)}
html[data-dist=b] .dots i.tr,html[data-dist=b] .lgi i.tr{background:var(--card);border:2.5px solid var(--d);box-shadow:none;border-radius:50%}

html[data-dist=b] .ic.tr,html[data-dist=b] .ei.tr{background-color:var(--card)}
/* C : barre latérale épaisse, comme une voie */
html[data-dist=c] .ev.tr{border-left:6px solid var(--d);border-radius:4px 12px 12px 4px;background-color:color-mix(in srgb,var(--d) 20%,var(--card))}
html[data-dist=c] .hr.act.tr{background-color:color-mix(in srgb,var(--d) 18%,var(--card));box-shadow:inset 6px 0 0 var(--d)}

html[data-dist=c] .chip.tr{border-left:5px solid var(--d);border-radius:4px 12px 12px 4px}

html[data-dist=d] .ev.tr{border:2px dashed var(--d);background-color:color-mix(in srgb,var(--d) 10%,var(--card));border-radius:12px}

html[data-dist=d] .dots i.tr,html[data-dist=d] .lgi i.tr{background:transparent;border:2px dashed var(--d);box-shadow:none;border-radius:50%}
html[data-dist=d] .chip.tr{border:2px dashed var(--d);background-color:color-mix(in srgb,var(--d) 10%,var(--card))}

.jr{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left}
.jr .t{flex:1;font-weight:600;min-width:0}
.jr small{color:var(--muted);white-space:nowrap}
.jr.wish{border-style:dashed}
.jgo{margin-top:10px;width:100%}
.jwarn{color:var(--muted);font-size:.78rem;margin-top:6px}
.jleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.76rem;color:var(--muted)}
.lgi{display:inline-flex;align-items:center;gap:6px}
.lgi i{display:inline-block;flex:none}
.lgi.d i{width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#B0524C}
.lgi.h i{width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.6px dashed #B0524C;box-sizing:border-box}
.lgi.n i{width:20px;height:4px;border-radius:2px;background:linear-gradient(90deg,#4A8FB0,#D8923A)}
.lgi.s i{width:20px;height:0;border-top:2.4px dashed #8E6A66}

.jm.reg .zlv{bottom:auto;top:10px}
.jsv .pf{fill:var(--c)}
.jsv.zin .pf{fill:color-mix(in srgb,var(--c) 40%,#FBF6EE);fill-opacity:1}
.jsv .rv{fill:none;stroke:color-mix(in srgb,#9FC3D6 70%,var(--card));stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.jsv .pke{fill:#B7D3A8;opacity:.75;pointer-events:none}
.jsv .dl{fill:color-mix(in srgb,var(--ink) 38%,transparent);font-weight:700;letter-spacing:.2em}

/* écran de connexion */
.gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px))}
.gate[hidden]{display:none}
.gcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.fuji{display:block;flex:none;line-height:0}.fuji svg{display:block}
.gcard .fuji{margin-bottom:6px}
.gcard h2{margin-bottom:10px}
.gcard input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:100%;outline:none}
.gcard input:focus{border-color:var(--accent)}
.gcard .btn{margin-top:6px;width:100%}
.gcard .mini{align-self:center;margin-top:4px}
.gmsg{min-height:1.4em;font-size:.88rem;color:var(--accent)}
#syncst{min-height:1.2em}

</style>

  setTimeout(function(){em.focus()},50)}
 function hideGate(){if(gate)gate.hidden=true}

 /* démarrage */
 var lib=window.supabase;
 if(lib&&lib.createClient){
  sb=lib.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s)connect(s);else showGate()},function(){showGate()});
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&userId){userId=null;showGate()}})
 }else{
  /* bibliothèque non chargée (hors ligne à la toute première ouverture) */
  var hasCache=false;try{hasCache=!!localStorage.getItem(LSK)}catch(e){}
  if(!hasCache)showGate();else setState('off');
  if(!hasCache){var g=gate&&gate.querySelector('.gmsg');if(g)g.textContent='Connexion à Internet requise pour la première ouverture.'}
 }
 setInterval(tick,700);
 window.addEventListener('online',function(){pull();push()});
 window.addEventListener('offline',function(){if(userId)setState('off')});
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&userId){pull();push()}});
 setInterval(function(){if(!document.hidden&&userId){if(Object.keys(dirty).length)push();else pull()}},45000);
 window.__sync={tick:tick,push:push,pull:pull,dirty:function(){return dirty},state:function(){return state},onChange:onChange,KEYS:KEYS};
})();

refresh();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
